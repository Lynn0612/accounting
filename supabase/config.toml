
[functions.line-auth]
enabled = true
verify_jwt = true
import_map = "./functions/line-auth/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/line-auth/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/line-auth/*.html" ]

[functions.monthly-summary-bot]
enabled = true
verify_jwt = false
entrypoint = "./functions/monthly-summary-bot/index.ts"

[functions.test-line-notify]
enabled = true
verify_jwt = false
entrypoint = "./functions/test-line-notify/index.ts"
